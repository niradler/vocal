[project]
name = "vocal-ai"
version = "0.4.0"
description = "Ollama-style Voice Model Management - Self-hosted OpenAI-compatible Speech AI"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "SSPL-1.0" }
authors = [
    { name = "Vocal Contributors" }
]
keywords = ["speech-to-text", "transcription", "whisper", "ollama", "tts", "stt", "openai-compatible", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Environment :: Console",
]
dependencies = [
    "vocal-core>=0.3.0",
    "vocal-sdk>=0.3.0",
    "vocal-api>=0.3.0",
    "vocal-cli>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/niradler/vocal"
Documentation = "https://github.com/niradler/vocal/tree/master/docs"
Repository = "https://github.com/niradler/vocal"
Issues = "https://github.com/niradler/vocal/issues"

[project.scripts]
vocal = "vocal_cli.main:app"

[project.optional-dependencies]
piper = [
    "piper-tts>=1.8.0",
    "scipy>=1.17.1",
]
kokoro = [
    "kokoro>=0.9.4",
    "torch>=2.15.0",
    "en-core-web-sm",
]
qwen3-tts = [
    "faster-qwen3-tts>=0.5.4",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]
nemo = [
    "nemo_toolkit[asr]>=3.0.0",
]
whisperx = [
    "whisperx>=3.8.6",
]
chatterbox = [
    "chatterbox-tts>=0.1.7",
]
supertonic = [
    "supertonic==1.3.1",
]
voxcpm = [
    "voxcpm>=2.0.3",
    "torch>=2.15.0",
]
voxtral = [
    "mistral-common>=1.13.1",
]
omnivoice = [
    "omnivoice>=0.2.1",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]
phonon = [
    "ptts>=0.7.1",
]
qwen3-omni = [
    "qwen-omni-utils>=0.0.6",
    "accelerate>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vocal"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
override-dependencies = [
    "ctranslate2>=4.9.0",
    "av>=17,<19",
    "transformers>=5.22,<5.23",
    "numpy>=2.4.3",
    "huggingface-hub>=2.4.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.1",
    "torchcodec>=0.17.0",
    "aiofiles>=25.1.0",
    "pydantic>=2.14.3",
    "pillow>=13.0.0",
    "starlette>=1.10.0",
    "websockets>=17.4",
    # setuptools 82 removed pkg_resources, which perth (chatterbox's watermarker) imports at runtime.
    "setuptools>=70.0.0,<82",
    "safetensors>=0.8.0",
]

[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/api",
    "packages/sdk",
    "packages/cli"
]

[tool.uv.sources]
vocal-core = { workspace = true, editable = true }
vocal-api = { workspace = true, editable = true }
vocal-sdk = { workspace = true, editable = true }
vocal-cli = { workspace = true, editable = true }
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchcodec = { index = "pytorch" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "build>=1.6.1",
    "bump-my-version>=1.8.1",
    "chatterbox-tts>=0.1.7",
    "nemo-toolkit>=3.0.0",
    "openapi-python-client>=0.29.1,<0.30",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-xdist>=3.8.0",
    "mistral-common>=1.13.1",
    "omnivoice>=0.2.1",
    "qwen-omni-utils>=0.0.6",
    "ruff>=0.17.5",
    "setuptools>=70.0.0,<82",

    "websockets>=17.4",
    "whisperx>=3.8.6",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 300
target-version = "py311"
exclude = [
    "packages/sdk/vocal_sdk/api",
    "packages/sdk/vocal_sdk/models",
    "packages/sdk/vocal_sdk/client.py",
    "packages/sdk/vocal_sdk/errors.py",
    "packages/sdk/vocal_sdk/types.py",
    "packages/sdk/gen-test",
    "packages/sdk/gen-test2",
    "packages/sdk/.gen-test",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "C90", # mccabe complexity
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP042", # str+Enum to StrEnum (optional Python 3.11+ upgrade)
]

[tool.ruff.lint.isort]
known-first-party = ["vocal_core", "vocal_api", "vocal_sdk", "vocal_cli"]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"] # Allow unused imports and late imports in __init__.py

[tool.bumpversion]
current_version = "0.4.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = true
commit = false
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/core/pyproject.toml"

[[tool.bumpversion.files]]
filename = "packages/api/pyproject.toml"

[[tool.bumpversion.files]]
filename = "packages/sdk/pyproject.toml"

[[tool.bumpversion.files]]
filename = "packages/cli/pyproject.toml"

[[tool.bumpversion.files]]
filename = "packages/core/vocal_core/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/sdk/vocal_sdk/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/cli/vocal_cli/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "vocal/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
