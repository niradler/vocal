<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocal Console</title>
    <meta name="description" content="Vocal web console — manage voice models, run speech pipelines and configure your self-hosted Speech AI server." />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A1A1A'/%3E%3Cpath d='M6 16h3l3-8 4 16 3-8h3' stroke='%2376B900' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: "#76B900",
              charcoal: "#2A2A2A",
              coal: "#1A1A1A",
              coolgrey: "#4A4A4A",
              electric: "#00BFFF",
              circuit: "#6EFA5F",
              lightgrey: "#BDBDBD",
            },
            fontFamily: { mono: ['"Roboto Mono"', "ui-monospace", "monospace"] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="font-mono">
    <div class="shell">
      <!-- ============ SIDEBAR ============ -->
      <aside id="sidebar" class="sidebar" aria-label="Console navigation">
        <div class="flex items-center gap-3 px-5 py-5">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="#2A2A2A" stroke="#3a3a3a" />
            <path d="M6 16h3l3-8 4 16 3-8h3" stroke="#76B900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div>
            <p class="text-base font-bold leading-none">vocal<span class="text-accent">.</span></p>
            <p class="mt-1 text-[10px] uppercase tracking-[0.25em] text-[#8a8a8a]">console</p>
          </div>
        </div>
        <div class="data-flow-line mx-5"></div>
        <nav id="nav" class="mt-4 flex flex-1 flex-col gap-1 px-3"></nav>
        <div class="border-t border-[#3a3a3a] px-5 py-4">
          <div class="flex items-center gap-2 text-xs text-lightgrey">
            <span id="sidebar-dot" class="dot dot-idle"></span>
            <span id="sidebar-status">connecting…</span>
          </div>
          <p id="sidebar-version" class="mt-1 text-[10px] text-[#8a8a8a]"></p>
        </div>
      </aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

      <!-- ============ MAIN ============ -->
      <div class="main-col">
        <header class="topbar">
          <div class="flex min-w-0 items-center gap-3">
            <button id="hamburger" class="btn btn-ghost btn-icon lg:hidden" aria-label="Open navigation">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>
            <h1 id="view-title" class="truncate text-base font-bold tracking-tight"></h1>
          </div>
          <div class="flex items-center gap-2">
            <span id="topbar-health" class="badge badge-green hidden sm:inline-flex"><span class="dot dot-live"></span>online</span>
            <button id="server-btn" class="btn btn-ghost btn-sm" title="Vocal server this console talks to">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
              <span id="server-btn-label" class="hidden md:inline">server</span>
            </button>
            <a id="docs-link" href="/docs" class="btn btn-ghost btn-sm" title="Interactive API docs">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              <span class="hidden md:inline">API</span>
            </a>
            <a id="home-link" href="/" class="btn btn-ghost btn-sm" title="Landing page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span class="hidden md:inline">Home</span>
            </a>
          </div>
        </header>
        <main id="view" class="view-area" tabindex="-1"></main>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
