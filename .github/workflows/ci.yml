name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  unit-tests:
    name: Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -v --tb=short

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (espeak-ng for pyttsx3, ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      - name: Run contract tests
        run: uv run python -m pytest tests/contract/ -v --tb=short
        env:
          LOG_LEVEL: WARNING

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the production requirement set
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          # PyTorch's cu132 wheels carry a local version tag that pip cannot resolve; the audited
          # code is the same, only the build index differs.
          sed -i -E 's/\+cu[0-9]+//' requirements-audit.txt

      # Audits what a plain `pip install vocal-ai` pulls in (no dev tools, no optional backends).
      # Ignored advisories are not reachable from Vocal's code paths:
      # - setuptools <82 is required for pkg_resources (perth/chatterbox watermarking); the
      #   advisory is a build-time MANIFEST.in Unicode issue.
      # - fsspec is capped by datasets (NeMo); the advisory is RCE in ReferenceFileSystem, which
      #   Vocal never instantiates.
      - name: Audit production dependencies
        run: |
          uv run --with pip-audit pip-audit -r requirements-audit.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln GHSA-xmj3-9gf7-h52w \
            --ignore-vuln PYSEC-2026-4217

  catalog-check:
    name: Model Catalog Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify catalog only claims runnable models
        run: uv run python -m pytest tests/unit/test_catalog_coverage.py -v --tb=short