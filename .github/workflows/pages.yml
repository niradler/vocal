# Deploys the Vocal web UI (landing page + console) to GitHub Pages.
# The console is fully static: visitors run Vocal locally (`vocal serve`) and
# the page talks to their server directly from the browser — no backend here.
name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "packages/api/vocal_api/webui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload web UI artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/api/vocal_api/webui

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
